<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Assignment 4: Lighting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d14;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      gap: 0;
      min-height: 100vh;
    }
    #canvas-wrap {
      flex: 0 0 auto;
      position: relative;
    }
    canvas {
      display: block;
      cursor: grab;
      background: #000;
    }
    canvas:active { cursor: grabbing; }

    #panel {
      width: 270px;
      padding: 12px;
      background: #111118;
      border-left: 1px solid #222;
      overflow-y: auto;
    }
    h2 {
      font-size: 15px;
      color: #fff;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a2a3a;
    }
    h3 {
      font-size: 11px;
      color: #6677aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 6px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    label {
      font-size: 11px;
      color: #888;
      min-width: 58px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #5577ff;
      height: 4px;
    }
    .val {
      font-size: 10px;
      color: #aaa;
      min-width: 30px;
      text-align: right;
      font-family: monospace;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }
    button {
      padding: 5px 10px;
      font-size: 11px;
      border: 1px solid #333;
      background: #1a1a28;
      color: #ccc;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    button:hover { background: #232338; border-color: #5577ff; }
    button.active {
      background: #1e3a6e;
      border-color: #5599ff;
      color: #88bbff;
    }
    button.on {
      background: #2a4a1a;
      border-color: #44cc66;
      color: #88ee88;
    }
    .keys {
      font-size: 10px;
      color: #555;
      line-height: 1.7;
      margin-top: 6px;
    }
    kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 10px;
      color: #aaa;
    }
    .color-preview {
      width: 14px; height: 14px;
      border-radius: 3px;
      border: 1px solid #444;
      flex-shrink: 0;
    }
    #fps {
      font-size: 10px;
      color: #446;
      font-family: monospace;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="webgl" width="820" height="620"></canvas>
</div>

<div id="panel">
  <h2>A4 — Lighting</h2>

  <h3>Lighting Controls</h3>
  <div class="btn-row">
    <button id="btn-light" class="active">💡 Light: ON</button>
    <button id="btn-spot">🔦 Spot: OFF</button>
    <button id="btn-normal">🎨 Normals: OFF</button>
  </div>

  <h3>Point Light Position</h3>
  <div class="row">
    <label>Angle</label>
    <input type="range" id="sl-angle" min="0" max="360" step="0.5" value="0">
    <span class="val" id="val-angle">0</span>
  </div>
  <div class="row">
    <label>Height Y</label>
    <input type="range" id="sl-y" min="0.5" max="8" step="0.1" value="3">
    <span class="val" id="val-y">3.0</span>
  </div>

  <h3>Light Color</h3>
  <div class="row">
    <div class="color-preview" id="color-preview" style="background:#ffffff"></div>
    <label>R</label>
    <input type="range" id="sl-r" min="0" max="1" step="0.01" value="1">
    <span class="val" id="val-r">1.00</span>
  </div>
  <div class="row">
    <label style="min-width:58px;margin-left:20px">G</label>
    <input type="range" id="sl-g" min="0" max="1" step="0.01" value="1">
    <span class="val" id="val-g">1.00</span>
  </div>
  <div class="row">
    <label style="min-width:58px;margin-left:20px">B</label>
    <input type="range" id="sl-b" min="0" max="1" step="0.01" value="1">
    <span class="val" id="val-b">1.00</span>
  </div>

  <h3>Camera</h3>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — Move<br>
    <kbd>Q</kbd><kbd>E</kbd> — Pan left / right<br>
    Mouse drag — Look<br>
    <kbd>↑</kbd><kbd>↓</kbd> — Move up / down
  </div>

  <h3>Scene</h3>
  <div class="keys">
    🐯 Tiger — center<br>
    🔵 Sphere × 2 — lit with Phong<br>
    🍩 Torus OBJ — right<br>
    🟡 Light marker cube<br>
    🔦 Spotlight at (−1, 6, 0)
  </div>

  <div id="fps">FPS: —</div>
</div>

<script src="lib/webgl-utils.js"></script>
<script src="lib/webgl-debug.js"></script>
<script src="lib/cuon-utils.js"></script>
<script src="lib/cuon-matrix-cse160.js"></script>
<script src="src/Camera.js"></script>
<script src="src/Cube.js"></script>
<script src="src/Sphere.js"></script>
<script src="src/OBJLoader.js"></script>
<script src="src/World.js"></script>

</body>
</html>
