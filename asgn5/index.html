<!--
  CSE 160 - Assignment 5 - Aayan Sheikh - UCSC Spring 2026
  A 3D world built with the high level Three.js library.

  REQUIREMENT CHECKLIST (where each thing is in the code):
    - 20+ primary shapes ............. buildIsland(), makeTree(), makeRock(),
                                       crate, pond, fences, mushrooms, crystals,
                                       sun, clouds  (40+ shapes total)
    - 3+ different kinds of shapes ... Cylinder, Cone, Box, Sphere,
                                       Icosahedron, Dodecahedron, Octahedron (7 kinds)
    - at least one textured shape .... island grass top + wooden crate
    - at least one animated shape .... floating crystals, drifting clouds,
                                       bobbing sun and duck
    - textured 3D model .............. Duck.glb (textured glTF)
    - 3+ light sources ............... Ambient, Hemisphere, Directional, Point (4)
    - textured skybox ................ Park2 cube map
    - perspective camera ............. THREE.PerspectiveCamera
    - mouse controls ................. OrbitControls

  WOW POINT:  The scene is a LIVING ecosystem. A fully animated, textured 3D
  Fox character (skinned glTF animation) continuously walks a loop around the
  island. Glowing crystals pulse and bob while driving a moving colored point
  light, clouds drift, a firefly particle system twinkles, soft shadow mapping
  and atmospheric fog give depth, and ACES tone mapping is used for a polished
  look. See the on-screen note.
-->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

    // ---- CDN paths for the textures/models we verified --------------------
    const TEX  = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures';
    const MODELS = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0';

    // =======================================================================
    // 1. RENDERER
    // =======================================================================
    const canvas   = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
    renderer.toneMapping        = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    // =======================================================================
    // 2. SCENE + FOG
    // =======================================================================
    const scene = new THREE.Scene();
    scene.fog   = new THREE.Fog(0xbcd6ef, 28, 70);

    // =======================================================================
    // 3. PERSPECTIVE CAMERA
    // =======================================================================
    const camera = new THREE.PerspectiveCamera(
      55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(14, 9, 18);

    // =======================================================================
    // 4. MOUSE CONTROLS (OrbitControls)
    // =======================================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.5, 0);
    controls.minDistance   = 6;
    controls.maxDistance   = 45;
    controls.maxPolarAngle = Math.PI * 0.49;   // don't go below the island

    // =======================================================================
    // 5. TEXTURED SKYBOX  (custom UC Santa Cruz sky, drawn procedurally to a
    //    canvas texture and projected as a 360 equirectangular sky -> redwoods,
    //    blue & gold sky, the Santa Cruz mountains, and the UCSC wordmark)
    // =======================================================================
    function buildUCSCSky() {
      const w = 2048, h = 1024, horizon = h * 0.5;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');

      // --- sky gradient: deep UCSC blue at top -> warm gold at the horizon ---
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0.0, '#0d3b66');
      sky.addColorStop(0.45, '#3f7cb6');
      sky.addColorStop(0.8, '#9cc3e6');
      sky.addColorStop(1.0, '#f3e2b3');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);

      // --- golden sun glow ---
      const sx = w * 0.68, sy = horizon * 0.55;
      const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 280);
      glow.addColorStop(0, 'rgba(255,247,214,0.95)');
      glow.addColorStop(0.25, 'rgba(253,199,0,0.55)');
      glow.addColorStop(1, 'rgba(253,199,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, w, horizon);
      ctx.beginPath(); ctx.arc(sx, sy, 58, 0, Math.PI * 2);
      ctx.fillStyle = '#fff7d6'; ctx.fill();

      // --- distant Santa Cruz mountains ---
      ctx.fillStyle = 'rgba(70,105,118,0.7)';
      ctx.beginPath(); ctx.moveTo(0, horizon);
      for (let x = 0; x <= w; x += 36) {
        const hh = horizon - (45 + 55 * Math.sin(x * 0.004) + 28 * Math.sin(x * 0.013));
        ctx.lineTo(x, hh);
      }
      ctx.lineTo(w, horizon); ctx.closePath(); ctx.fill();

      // --- forest floor below the horizon ---
      const grd = ctx.createLinearGradient(0, horizon, 0, h);
      grd.addColorStop(0, '#2e4a2a'); grd.addColorStop(1, '#14210f');
      ctx.fillStyle = grd; ctx.fillRect(0, horizon, w, h - horizon);

      // --- iconic redwood treeline wrapping the whole horizon ---
      function redwood(cx, baseY, th, tw, col) {
        ctx.fillStyle = '#3a2414';
        ctx.fillRect(cx - tw * 0.05, baseY - th * 0.16, tw * 0.10, th * 0.16);
        ctx.fillStyle = col;
        const layers = 6;
        for (let i = 0; i < layers; i++) {
          const ly = baseY - th * 0.10 - (th * 0.82) * (i / layers);
          const lw = tw * (1 - i / (layers + 1));
          ctx.beginPath();
          ctx.moveTo(cx - lw / 2, ly);
          ctx.lineTo(cx + lw / 2, ly);
          ctx.lineTo(cx, ly - th * 0.26);
          ctx.closePath(); ctx.fill();
        }
      }
      let seed = 20260603;
      const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
      for (let cx = 8; cx < w + 90; cx += 44) {
        const th = 165 + rnd() * 175;
        const tw = 72 + rnd() * 42;
        const s = 16 + Math.floor(rnd() * 20);
        redwood(cx, horizon + 16, th, tw, `rgb(${s},${s + 34},${s + 12})`);
      }

      // --- UC SANTA CRUZ wordmark (appears once as you turn around) ---
      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#fdc700';
      ctx.font = 'bold 76px Georgia, "Times New Roman", serif';
      ctx.fillText('UC SANTA CRUZ', w * 0.27, horizon * 0.40);
      ctx.font = 'italic 36px Georgia, serif';
      ctx.fillText('Go Slugs', w * 0.27, horizon * 0.40 + 52);
      ctx.restore();

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.wrapS = THREE.RepeatWrapping;
      return tex;
    }
    scene.background = buildUCSCSky();

    // =======================================================================
    // 6. LIGHTS (4 different kinds)
    // =======================================================================
    // (a) Ambient - soft base fill so nothing is pure black
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // (b) Hemisphere - sky color from above, ground color from below
    scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x6b5a3f, 0.8));

    // (c) Directional - the "sun", casts shadows
    const sun = new THREE.DirectionalLight(0xfff4d6, 1.8);
    sun.position.set(18, 26, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far  = 80;
    sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
    sun.shadow.camera.top  =  22; sun.shadow.camera.bottom = -22;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    // (d) Point - warm glow that follows the crystals (moves each frame)
    const crystalLight = new THREE.PointLight(0x66ccff, 2.2, 22, 2);
    crystalLight.position.set(0, 4, 0);
    scene.add(crystalLight);

    // =======================================================================
    // 7. TEXTURE LOADER + helpers
    // =======================================================================
    const texLoader = new THREE.TextureLoader();

    function loadColorTexture(url, repeat) {
      const t = texLoader.load(url);
      t.colorSpace = THREE.SRGBColorSpace;
      if (repeat) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeat, repeat);
      }
      return t;
    }

    const animated = [];   // things we spin/bob in the render loop

    // =======================================================================
    // 8. THE FLOATING ISLAND  (cylinder top + cone underside)  [TEXTURED top]
    // =======================================================================
    function buildIsland() {
      const g = new THREE.Group();

      const grassTex = loadColorTexture(TEX + '/terrain/grasslight-big.jpg', 4);
      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(9, 9, 1.6, 48),
        new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
      top.position.y = -0.8;
      top.receiveShadow = true;
      g.add(top);

      const underside = new THREE.Mesh(
        new THREE.ConeGeometry(9, 9, 48),
        new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1, flatShading: true }));
      underside.position.y = -6.1;
      underside.rotation.y = Math.PI / 8;
      underside.castShadow = true;
      g.add(underside);

      scene.add(g);
    }

    // =======================================================================
    // 9. TREES   (cylinder trunk + cone OR icosahedron foliage)
    // =======================================================================
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e4a2b, roughness: 1 });
    const leafMatA = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 1, flatShading: true });
    const leafMatB = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 1, flatShading: true });

    function makeTree(x, z, type) {
      const tree = new THREE.Group();

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.38, 2.2, 10), trunkMat);
      trunk.position.y = 1.1;
      trunk.castShadow = trunk.receiveShadow = true;
      tree.add(trunk);

      if (type === 'pine') {                          // CONE foliage (stacked)
        for (let i = 0; i < 3; i++) {
          const cone = new THREE.Mesh(
            new THREE.ConeGeometry(1.5 - i * 0.35, 1.5, 8), leafMatA);
          cone.position.y = 2.4 + i * 1.0;
          cone.castShadow = true;
          tree.add(cone);
        }
      } else {                                         // ICOSAHEDRON foliage
        const ball = new THREE.Mesh(
          new THREE.IcosahedronGeometry(1.5, 0), leafMatB);
        ball.position.y = 3.4;
        ball.castShadow = true;
        tree.add(ball);
      }

      tree.position.set(x, 0, z);
      scene.add(tree);
    }

    // =======================================================================
    // 10. ROCKS  (dodecahedron)
    // =======================================================================
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8d91, roughness: 1, flatShading: true });
    function makeRock(x, z, s) {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
      rock.position.set(x, s * 0.55, z);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = rock.receiveShadow = true;
      scene.add(rock);
    }

    // =======================================================================
    // 11. WOODEN CRATE   (BOX, TEXTURED with the classic crate texture)
    // =======================================================================
    function makeCrate(x, z) {
      const crateTex = loadColorTexture(TEX + '/crate.gif');
      const crate = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 1.6, 1.6),
        new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.8 }));
      crate.position.set(x, 0.8, z);
      crate.rotation.y = 0.4;
      crate.castShadow = crate.receiveShadow = true;
      scene.add(crate);
    }

    // =======================================================================
    // 12. POND  (thin cylinder, translucent water)
    // =======================================================================
    function makePond(x, z) {
      const pond = new THREE.Mesh(
        new THREE.CylinderGeometry(2.4, 2.4, 0.2, 32),
        new THREE.MeshStandardMaterial({
          color: 0x2f7fb0, roughness: 0.1, metalness: 0.2,
          transparent: true, opacity: 0.85 }));
      pond.position.set(x, 0.05, z);
      pond.receiveShadow = true;
      scene.add(pond);
      return pond;
    }

    // =======================================================================
    // 13. FENCE  (boxes for posts + rails)
    // =======================================================================
    function makeFence() {
      const fenceMat = new THREE.MeshStandardMaterial({ color: 0x9c6b3f, roughness: 1 });
      const posts = [[-8.0,0.0],[-7.7,2.2],[-6.9,4.0],[-7.5,-2.2],[-6.6,-4.0]];
      for (const [x, z] of posts) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.4, 0.22), fenceMat);
        post.position.set(x, 0.7, z);
        post.castShadow = post.receiveShadow = true;
        scene.add(post);
      }
      // a couple of horizontal rails
      const rail1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.18, 2.3), fenceMat);
      rail1.position.set(-7.85, 1.0, 1.1); rail1.rotation.y = 0.135;
      rail1.castShadow = true; scene.add(rail1);
    }

    // =======================================================================
    // 14. MUSHROOMS  (cylinder stem + half-sphere cap)
    // =======================================================================
    function makeMushroom(x, z, s) {
      const m = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12 * s, 0.16 * s, 0.6 * s, 10),
        new THREE.MeshStandardMaterial({ color: 0xf2ead3, roughness: 1 }));
      stem.position.y = 0.3 * s; stem.castShadow = true;
      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.4 * s, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0xd23b3b, roughness: 0.9 }));
      cap.position.y = 0.6 * s; cap.castShadow = true;
      m.add(stem, cap);
      m.position.set(x, 0, z);
      scene.add(m);
    }

    // =======================================================================
    // 15. FLOATING CRYSTALS  (OCTAHEDRON, ANIMATED + emissive)
    // =======================================================================
    function makeCrystals() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x66ccff, emissive: 0x2299ff, emissiveIntensity: 0.9,
        roughness: 0.1, metalness: 0.4, transparent: true, opacity: 0.9 });
      for (let i = 0; i < 4; i++) {
        const c = new THREE.Mesh(new THREE.OctahedronGeometry(0.5 + i * 0.12), mat);
        const a = (i / 4) * Math.PI * 2;
        c.position.set(Math.cos(a) * 2.2, 4 + i * 0.3, Math.sin(a) * 2.2);
        c.castShadow = true;
        c.userData = { baseY: c.position.y, phase: a, angle: a };
        scene.add(c);
        animated.push({ mesh: c, type: 'crystal' });
      }
    }

    // =======================================================================
    // 16. CLOUDS  (clusters of spheres, ANIMATED drift)
    // =======================================================================
    function makeCloud(x, y, z) {
      const cloud = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
      const puffs = [[0,0,0,1.4],[1.3,-0.2,0,1.0],[-1.3,-0.2,0.2,1.0],[0.4,0.4,0.6,0.9]];
      for (const [px, py, pz, r] of puffs) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat);
        puff.position.set(px, py, pz);
        cloud.add(puff);
      }
      cloud.position.set(x, y, z);
      scene.add(cloud);
      animated.push({ mesh: cloud, type: 'cloud', speed: 0.4 + Math.random() * 0.3 });
    }

    // =======================================================================
    // 17. SUN SPHERE  (visible glowing ball, ANIMATED gentle bob)
    // =======================================================================
    const sunBall = new THREE.Mesh(
      new THREE.SphereGeometry(2, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8 }));
    sunBall.position.set(18, 26, 12);
    scene.add(sunBall);
    animated.push({ mesh: sunBall, type: 'sun' });

    // =======================================================================
    // 18. FIREFLY PARTICLE SYSTEM  (WOW detail)
    // =======================================================================
    function makeFireflies() {
      const N = 160;
      const pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 8;
        pos[i*3]   = Math.cos(a) * r;
        pos[i*3+1] = 0.5 + Math.random() * 5;
        pos[i*3+2] = Math.sin(a) * r;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xfff1a8, size: 0.18, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);
      animated.push({ mesh: pts, type: 'fireflies' });
    }

    // =======================================================================
    // 19. BUILD THE WORLD
    // =======================================================================
    buildIsland();

    // trees (mix of pine + round)  -> lots of cylinders/cones/icosahedrons
    makeTree(-3.5, -3.0, 'pine');  makeTree(3.2, -3.2, 'pine');  makeTree(-4.7, 0.8, 'round');
    makeTree(-2.0, 4.3, 'pine');   makeTree(4.5, 1.8, 'pine');   makeTree(0.5, -4.8, 'round');
    makeTree(-4.5, -1.8, 'pine');

    // rocks
    makeRock(-1.5, -2.5, 0.9); makeRock(3.5, 2.0, 0.7);
    makeRock(-3.5, -0.5, 0.6); makeRock(1.0, -4.5, 0.8);

    makeCrate(-3.5, 3.5);
    const pond = makePond(1.5, 1.0);
    makeFence();
    makeMushroom(-2, -0.5, 1); makeMushroom(-2.7, 0.2, 0.8); makeMushroom(2.5, -2.0, 1.1);

    makeCrystals();
    makeCloud(-14, 12, -6); makeCloud(12, 14, -10); makeCloud(2, 16, 14);
    makeFireflies();

    // =======================================================================
    // 20. LOAD TEXTURED 3D MODELS (glTF)
    //     Duck.glb  = required textured model (sits by the pond)
    //     Fox.glb   = WOW: animated textured character that walks the island
    // =======================================================================
    const gltfLoader = new GLTFLoader();
    function b64ToBuf(b64){const bin=atob(b64);const n=bin.length;const a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=bin.charCodeAt(i);return a.buffer;}
    const loaderEl   = document.getElementById('loader');
    let loadedCount  = 0;
    function modelDone() { if (++loadedCount >= 2) loaderEl.style.display = 'none'; }
    // safety: hide the loader after 8s no matter what
    setTimeout(() => loaderEl.style.display = 'none', 8000);

    // --- helper: scale a model to a target height and stand it on the ground
    function placeOnGround(obj, targetHeight, x, z) {
      let box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(); box.getSize(size);
      const scale = targetHeight / size.y;
      obj.scale.setScalar(scale);
      box = new THREE.Box3().setFromObject(obj);     // recompute after scaling
      obj.position.x += x - (box.min.x + box.max.x) / 2;
      obj.position.z += z - (box.min.z + box.max.z) / 2;
      obj.position.y += -box.min.y;                  // feet on y = 0
      obj.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    }

    // --- Duck (textured, required model) ---
    let duck = null;
    gltfLoader.parse(b64ToBuf(window.__DUCK_B64), '', (g) => {
      duck = g.scene;
      placeOnGround(duck, 1.6, 1.5, 3.6);
      duck.rotation.y = -0.6;
      duck.userData.baseY = duck.position.y;
      scene.add(duck);
      animated.push({ mesh: duck, type: 'duck' });
      modelDone();
    }, (e) => { console.error('Duck failed', e); modelDone(); });

    // --- Fox (textured + animated, the WOW character) ---
    let foxMixer = null;
    let fox = null;
    const FOX_RADIUS = 6.5;
    gltfLoader.parse(b64ToBuf(window.__FOX_B64), '', (g) => {
      fox = g.scene;
      placeOnGround(fox, 2.2, FOX_RADIUS, 0);   // initial spot; orbit overrides x/z
      // play a walk/run animation if present
      if (g.animations && g.animations.length) {
        foxMixer = new THREE.AnimationMixer(fox);
        const clip = g.animations.find(c => /walk|run|survey/i.test(c.name)) || g.animations[0];
        foxMixer.clipAction(clip).play();
      }
      fox.traverse(n => { if (n.isMesh) { n.castShadow = true; } });
      scene.add(fox);
      modelDone();
    }, (e) => { console.error('Fox failed', e); modelDone(); });

    // =======================================================================
    // 21. RESIZE HANDLING
    // =======================================================================
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    // =======================================================================
    // 22. ANIMATION LOOP
    // =======================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t  = clock.getElapsedTime();

      // animate all the registered objects
      for (const a of animated) {
        if (a.type === 'crystal') {
          a.mesh.rotation.y += dt * 0.8;
          a.mesh.rotation.x += dt * 0.4;
          a.mesh.userData.angle += dt * 0.4;
          const ang = a.mesh.userData.angle;
          a.mesh.position.x = Math.cos(ang) * 2.2;
          a.mesh.position.z = Math.sin(ang) * 2.2;
          a.mesh.position.y = a.mesh.userData.baseY + Math.sin(t * 1.5 + a.mesh.userData.phase) * 0.4;
        } else if (a.type === 'cloud') {
          a.mesh.position.x += dt * a.speed;
          if (a.mesh.position.x > 22) a.mesh.position.x = -22;
        } else if (a.type === 'sun') {
          a.mesh.position.y = 26 + Math.sin(t * 0.5) * 0.6;
        } else if (a.type === 'duck' && duck) {
          duck.position.y = duck.userData.baseY + Math.sin(t * 2) * 0.06;
        } else if (a.type === 'fireflies') {
          a.mesh.rotation.y += dt * 0.05;
          a.mesh.material.opacity = 0.6 + Math.abs(Math.sin(t * 2)) * 0.4;
        }
      }

      // crystal point light tracks the first crystal so the glow moves
      if (animated[0] && animated[0].type === 'crystal') {
        crystalLight.position.copy(animated[0].mesh.position);
        crystalLight.intensity = 1.8 + Math.sin(t * 3) * 0.8;   // pulse
      }

      // WOW: fox walks a loop around the island, facing its heading
      if (fox) {
        const ang = t * 0.45;
        fox.position.x = Math.cos(ang) * FOX_RADIUS;
        fox.position.z = Math.sin(ang) * FOX_RADIUS;
        // heading = derivative of position; +PI/2 offset for the model's forward
        fox.rotation.y = -ang + Math.PI / 2;
      }
      if (foxMixer) foxMixer.update(dt);

      controls.update();
      renderer.render(scene, camera);
    }

    // make the canvas fill the window initially
    onResize();
    animate();
  </script>
</body>
</html>
